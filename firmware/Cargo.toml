[package]
name = "drouter-firmware"
version = "0.2.4"
edition = "2021"
build = "build.rs"

[lib]
name = "drouter"

[[bin]]
name = "drouter-firmware"
path = "src/main.rs"
required-features = ["esp"]

[features]
default = []
esp = ["dep:esp-idf-svc", "dep:embuild", "dep:log"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
drouter-auth = { path = "../protocol/auth" }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
srp = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zeroize = "1"
log = { version = "0.4", optional = true }
esp-idf-svc = { version = "0.52", optional = true, features = ["experimental"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"], optional = true }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.4.2"
esp_idf_sdkconfig_defaults = ["firmware/sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "1.4.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/led_strip", version = "3.0.0" }
bindings_header = "led_strip_bindings.h"
