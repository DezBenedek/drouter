[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_SYS_ROOT_CRATE = "drouter-firmware"
ESP_IDF_GLOB_DROUTER_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_DROUTER_FILE = "partitions.csv"
