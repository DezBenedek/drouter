[package]
name = "drouter-auth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
srp = "0.6"
sha2.workspace = true
hex.workspace = true
pbkdf2 = "0.12"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
