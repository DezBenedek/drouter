[package]
name = "drouter-simulator"
version = "0.2.0"
edition = "2021"

[dependencies]
drouter-firmware = { path = "../firmware" }
drouter-auth = { path = "../protocol/auth" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rand.workspace = true
hex.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
ureq = { version = "2.12", features = ["json"] }
url = "2"
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"
